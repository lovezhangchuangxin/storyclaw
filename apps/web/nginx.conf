upstream backend {
    server backend:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API reverse proxy
    location /storyclaw/api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Static assets with long cache (Vite adds content hashes)
    location /storyclaw/assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # PWA: service worker must not be cached
    location = /storyclaw/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { application/javascript js; }
    }

    # PWA: manifest with correct MIME type
    location = /storyclaw/manifest.webmanifest {
        add_header Cache-Control "public, max-age=300";
        types { application/manifest+json webmanifest; }
    }

    # SPA fallback
    location /storyclaw/ {
        try_files $uri $uri/ /storyclaw/index.html;
    }

    # Root redirect
    location = / {
        return 302 /storyclaw/;
    }

    # Health check for Docker
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
