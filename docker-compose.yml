services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '10'
    environment:
      POSTGRES_USER: storyclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyclaw_dev}
      POSTGRES_DB: storyclaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storyclaw']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '10'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '10'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://storyclaw:${POSTGRES_PASSWORD:-storyclaw_dev}@postgres:5432/storyclaw
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MODEL_ENCRYPTION_KEY: ${MODEL_ENCRYPTION_KEY:?MODEL_ENCRYPTION_KEY must be set}
      PORT: '3000'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      RUST_LOG: ${RUST_LOG:-storyclaw_backend=info,tower_http=warn}
      STORYCLAW_PRODUCTION: '1'
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-1000000}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-20}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '10'
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '10'
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
